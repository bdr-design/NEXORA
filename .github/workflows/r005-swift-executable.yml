name: R005 Swift Executable Results
on:
  push:
    branches: ["diagnostic/r005-design-1m-20260930"]
permissions:
  contents: read
jobs:
  swift-model:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Source and environment
        run: |
          mkdir -p swift-results
          git rev-parse HEAD > swift-results/commit.txt
          git rev-parse HEAD^{tree} > swift-results/tree.txt
          swift --version > swift-results/environment.txt
          xcodebuild -version >> swift-results/environment.txt
          uname -a >> swift-results/environment.txt
          sysctl hw.model hw.memsize >> swift-results/environment.txt
      - name: Swift 6 Debug and Release builds
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          swift build -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../swift-results/build-debug.txt
          swift build -c release -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../swift-results/build-release.txt
      - name: Actual Swift behavior, mutation, recovery and measured storage gates
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          cc -dynamiclib -O2 -Wall -Wextra -Werror AllocationObserver.c -ISources/ProbePlatform/include -o ../../swift-results/AllocationObserver.dylib
          export NXR_ALLOCATOR_DYLIB="$PWD/../../swift-results/AllocationObserver.dylib"
          python3 -B run_suite.py .build/debug/nxr-swift-probe ../../swift-results/debug 2>&1 | tee ../../swift-results/debug-run.txt
          python3 -B run_suite.py .build/release/nxr-swift-probe ../../swift-results/release --release 2>&1 | tee ../../swift-results/release-run.txt
      - name: R005 Stage A deterministic Debug gates and Release measurement
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          export NXR_ALLOCATOR_DYLIB="$PWD/../../swift-results/AllocationObserver.dylib"
          .build/debug/nxr-swift-probe hybrid-selftest > ../../swift-results/stage005-a-debug-layout.json
          .build/debug/nxr-swift-probe hybrid-mutants > ../../swift-results/stage005-a-debug-mutants.json
          .build/debug/nxr-swift-probe hybrid-order 100000 > ../../swift-results/stage005-a-debug-order-100k.json
          .build/debug/nxr-swift-probe hybrid-order 1000000 > ../../swift-results/stage005-a-debug-order-1m.json
          python3 -B stage005_a.py .build/release/nxr-swift-probe ../../swift-results/STAGE005-A.json 2>&1 | tee ../../swift-results/stage005-a-run.txt
      - name: Actual Swift model under Thread Sanitizer
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          swift build --scratch-path .build-tsan --sanitize=thread -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../swift-results/tsan-build.txt
          .build-tsan/debug/nxr-swift-probe selftest > ../../swift-results/tsan-selftest.json
          .build-tsan/debug/nxr-swift-probe order 1000 > ../../swift-results/tsan-order.json
          .build-tsan/debug/nxr-swift-probe hybrid-selftest > ../../swift-results/stage005-a-tsan-layout.json
          .build-tsan/debug/nxr-swift-probe hybrid-mutants > ../../swift-results/stage005-a-tsan-mutants.json
          .build-tsan/debug/nxr-swift-probe hybrid-order 100000 > ../../swift-results/stage005-a-tsan-order-100k.json
          .build-tsan/debug/nxr-swift-probe hybrid-order 1000000 > ../../swift-results/stage005-a-tsan-order-1m.json
          python3 -B stage005_b_crash.py .build-tsan/debug/nxr-swift-probe ../../swift-results/STAGE005-B-KILLS-tsan.json 2>&1 | tee ../../swift-results/stage005-b-kills-tsan.txt
          python3 -B crash_tests.py .build-tsan/debug/nxr-swift-probe ../../swift-results/tsan-crashes.json
      - name: R005 Stage B generated-finance retention and crash gates
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          python3 -B stage005_b_crash.py .build/debug/nxr-swift-probe ../../swift-results/STAGE005-B-KILLS-debug.json 2>&1 | tee ../../swift-results/stage005-b-kills-debug.txt
          python3 -B stage005_b_crash.py .build/release/nxr-swift-probe ../../swift-results/STAGE005-B-KILLS-release.json 2>&1 | tee ../../swift-results/stage005-b-kills-release.txt
          python3 -B stage005_b.py .build/release/nxr-swift-probe ../../swift-results/STAGE005-B.json 2>&1 | tee ../../swift-results/stage005-b-run.txt
      - name: R005 Stage C build, incremental-save crash gates and 100-save measurement
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          export NXR_ALLOCATOR_DYLIB="$PWD/../../swift-results/AllocationObserver.dylib"
          swift build --scratch-path .build-stagec-debug -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../swift-results/stage005-c-build-debug.txt
          swift build --scratch-path .build-stagec-release -c release -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../swift-results/stage005-c-build-release.txt
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" .build-stagec-release/release/nxr-swift-probe stage-c-allocation-probes > ../../swift-results/stage005-c-allocation-probes.json
          python3 -B stage005_c_crash.py .build-stagec-debug/debug/nxr-swift-probe ../../swift-results/STAGE005-C-KILLS-debug.json 2>&1 | tee ../../swift-results/stage005-c-kills-debug.txt
          python3 -B stage005_c_crash.py .build-stagec-release/release/nxr-swift-probe ../../swift-results/STAGE005-C-KILLS-release.json 2>&1 | tee ../../swift-results/stage005-c-kills-release.txt
          swift build --scratch-path .build-stagec-tsan --sanitize=thread -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../swift-results/stage005-c-build-tsan.txt
          python3 -B stage005_c_crash.py .build-stagec-tsan/debug/nxr-swift-probe ../../swift-results/STAGE005-C-KILLS-tsan.json 2>&1 | tee ../../swift-results/stage005-c-kills-tsan.txt
          python3 -B stage005_c.py .build-stagec-release/release/nxr-swift-probe ../../swift-results/STAGE005-C.json ../../swift-results/STAGE005-A.json 2>&1 | tee ../../swift-results/stage005-c-run.txt
      - name: Production unchanged and source file digests
        run: |
          set -euo pipefail
          python3 -B Checks/financial-diagnostics.py --guard --selftest > swift-results/original-source-guard.txt
          bad="$(grep -rnE 'Unsafe|withUnsafe' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift' | grep -v '/Snapshot.swift:' || true)"
          test -z "$bad"
          ! grep -rnE '@unchecked Sendable|nonisolated\\(unsafe\\)|unowned\\(unsafe\\)|Unmanaged|UnsafeMutable|unsafeBitCast' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift'
          git diff --exit-code
          find Experiments/R005Swift/Sources -type f -exec shasum -a 256 {} \; > swift-results/new-source-sha256.txt
      - name: Keep all results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r005-swift-executable-results
          path: swift-results/
          if-no-files-found: error
