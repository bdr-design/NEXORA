name: NEXORA R004 Review Gates

on:
  push:
    branches:
      - review/r004-comprehensive-audit-20260930
      - fix/r004-evidence-hardening-20260930
      - diagnostic/r004-causal-trace-20260930
  pull_request:
    branches:
      - fix/r004-evidence-hardening-20260930
      - diagnostic/r004-causal-trace-20260930

# No path filter: every change on these branches must enter the gates.
permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Source identity
        run: |
          set -euo pipefail
          mkdir audit-evidence
          git rev-parse HEAD > audit-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > audit-evidence/source-tree.txt
          git archive --format=zip --output=audit-evidence/NEXORA_R004_AUDIT_SOURCE.zip HEAD
          swift --version > audit-evidence/environment.txt
          python3 --version >> audit-evidence/environment.txt
          xcodebuild -version >> audit-evidence/environment.txt
          sw_vers >> audit-evidence/environment.txt
      - name: Evidence validator regressions and frozen-source guard
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ReviewTests -p 'test_*.py' -v 2>&1 | tee audit-evidence/validator-tests.txt
          python3 Checks/financial-diagnostics.py --guard --selftest 2>&1 | tee audit-evidence/source-guard.txt
          python3 Checks/review-r002.py
          python3 Checks/review-r003.py
          python3 Checks/review-r004.py
      - name: Fresh Debug and Release contracts
        run: |
          set -euo pipefail
          swift test -Xswiftc -warnings-as-errors 2>&1 | tee audit-evidence/debug.txt
          swift test -c release -Xswiftc -warnings-as-errors 2>&1 | tee audit-evidence/release.txt
      - name: Actual diagnostic and exclusive-writer gates
        run: |
          set -euo pipefail
          for config in debug release; do
            bin="$(swift build -c "$config" --show-bin-path)"
            "$bin/nexora-financial-check" --diagnostic-selftest 2>&1 | tee "audit-evidence/diagnostic-$config.txt"
            if [ "$GITHUB_REF_NAME" = "diagnostic/r004-causal-trace-20260930" ]; then
              "$bin/nexora-financial-check" --trace-selftest 2>&1 | tee "audit-evidence/trace-selftest-$config.txt"
            fi
            python3 ReviewTests/verify_writer.py "$bin/nexora-financial-check" 2>&1 | tee "audit-evidence/writer-$config.txt"
          done
      - name: External compiler and corruption boundaries
        run: |
          set -euo pipefail
          for script in verify verify-r002 verify-r003 verify-r004 verify-failstop verify-trip-failstop verify-finance-failstop; do
            bash "Checks/$script.sh" 2>&1 | tee "audit-evidence/$script.txt"
          done
      - name: Fresh Apple Thread Sanitizer including the diagnostic executable
        run: |
          set -euo pipefail
          swift test --scratch-path .build/audit-tsan --sanitize=thread -Xswiftc -warnings-as-errors 2>&1 | tee audit-evidence/tsan.txt
          swift build --scratch-path .build/audit-tsan --sanitize=thread --product nexora-financial-check -Xswiftc -warnings-as-errors 2>&1 | tee audit-evidence/diagnostic-tsan-build.txt
          bin="$(swift build --scratch-path .build/audit-tsan --sanitize=thread --show-bin-path)"
          "$bin/nexora-financial-check" --diagnostic-selftest 2>&1 | tee audit-evidence/diagnostic-tsan.txt
          python3 ReviewTests/verify_writer.py "$bin/nexora-financial-check" 2>&1 | tee audit-evidence/writer-tsan.txt
          if [ "$GITHUB_REF_NAME" = "diagnostic/r004-causal-trace-20260930" ]; then
            "$bin/nexora-financial-check" --trace-selftest 2>&1 | tee audit-evidence/trace-selftest-tsan.txt
          fi
      - name: Fresh schema and CLI smoke test, not a performance campaign
        run: |
          set -euo pipefail
          bin="$(swift build -c release --show-bin-path)"
          NEXORA_SOURCE_COMMIT="$GITHUB_SHA" "$bin/nexora-financial-check" --diagnostics audit-evidence/quick.ndjson --quick 2>&1 | tee audit-evidence/quick.txt
          python3 Checks/financial-diagnostics.py --output audit-evidence/quick-summary.json audit-evidence/quick.ndjson
      - name: Retrieve exact prior measurement artifact, not a new benchmark
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "11086348930"
          run-id: "36692367500"
          github-token: ${{ github.token }}
          repository: bdr-design/NEXORA
          path: prior-evidence
          merge-multiple: true
      - name: Revalidate pinned original raw data without changing statistics
        run: |
          set -euo pipefail
          python3 ReviewTests/revalidate_apple.py prior-evidence audit-evidence/revalidated-summary.json 2>&1 | tee audit-evidence/revalidation.txt
          python3 Checks/financial-diagnostics.py --guard
          git diff --exit-code
      - name: Record available Apple profiling capabilities
        run: |
          set -euo pipefail
          xcrun xctrace list templates > audit-evidence/xctrace-templates.txt 2>&1
          xcrun xctrace help record > audit-evidence/xctrace-record-help.txt 2>&1
          xcrun xctrace help export > audit-evidence/xctrace-export-help.txt 2>&1
      - name: Symbolized causal acquisition, not a speed optimization
        if: github.ref_name == 'diagnostic/r004-causal-trace-20260930'
        run: |
          set -euo pipefail
          swift build -c release --scratch-path .build/profile --product nexora-financial-check -Xswiftc -g -Xswiftc -warnings-as-errors 2>&1 | tee audit-evidence/profile-build.txt
          bin="$(swift build -c release --scratch-path .build/profile --show-bin-path)/nexora-financial-check"
          xcrun dsymutil "$bin" -o "$bin.dSYM"
          xcrun dwarfdump --uuid "$bin" > audit-evidence/binary-uuid.txt
          xcrun dwarfdump --uuid "$bin.dSYM" > audit-evidence/dsym-uuid.txt
          cp "$bin" audit-evidence/nexora-financial-check
          cp -R "$bin.dSYM" audit-evidence/nexora-financial-check.dSYM
          python3 ReviewTests/acquire_trace.py "$bin" "$GITHUB_SHA" audit-evidence/causal
      - name: Preserve audit evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-r004-comprehensive-audit
          path: audit-evidence/
          if-no-files-found: error
          compression-level: 6
