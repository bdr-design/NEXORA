name: R005 bounded micro and targeted C proof
on:
  push:
    branches: ["diagnostic/r005-design-1m-20260930"]
permissions:
  contents: read
  actions: read
jobs:
  r005-marker-conflict:
    if: ${{ !contains(github.event.head_commit.message, '[r005-evidence-only]') && contains(github.event.head_commit.message, '[r005-paired-profile]') && (contains(github.event.head_commit.message, '[r005-micro]') || contains(github.event.head_commit.message, '[r005-c-targeted]') || contains(github.event.head_commit.message, '[r005-b-full]') || contains(github.event.head_commit.message, '[r005-c-functional]')) || (!contains(github.event.head_commit.message, '[r005-evidence-only]') && contains(github.event.head_commit.message, '[r005-epoch-pages]') && (contains(github.event.head_commit.message, '[r005-micro]') || contains(github.event.head_commit.message, '[r005-c-targeted]') || contains(github.event.head_commit.message, '[r005-b-full]') || contains(github.event.head_commit.message, '[r005-c-functional]') || contains(github.event.head_commit.message, '[r005-paired-profile]'))) }}
    runs-on: macos-15
    steps:
      - name: Reject conflicting bounded-run markers
        run: |
          echo 'paired-profile and epoch-pages are diagnostic-only and each must be the only execution marker on its commit.'
          exit 1
  stage-b-full:
    if: ${{ contains(github.event.head_commit.message, '[r005-b-full]') && !contains(github.event.head_commit.message, '[r005-evidence-only]') && !contains(github.event.head_commit.message, '[r005-paired-profile]') && !contains(github.event.head_commit.message, '[r005-epoch-pages]') }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pin source and check production boundary
        run: |
          set -euo pipefail
          mkdir -p b-results
          git rev-parse HEAD > b-results/commit.txt
          git rev-parse HEAD^{tree} > b-results/tree.txt
          swift --version > b-results/environment.txt
          xcodebuild -version >> b-results/environment.txt
          python3 -B Checks/financial-diagnostics.py --guard --selftest > b-results/source-guard-before.txt
          python3 -B -m unittest discover -s Experiments/R005Swift/tests -v > b-results/proof-gates.txt 2>&1
      - name: Confirm B crash proof source is byte-identical
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin a65a5912be0116564f2a5d075da5c83b0c6b9e12
          gh api repos/bdr-design/NEXORA/actions/artifacts/11430977253/zip > "$RUNNER_TEMP/b-proof.zip"
          python3 - "$RUNNER_TEMP/b-proof.zip" <<'PYCODE'
          import hashlib,json,pathlib,subprocess,sys,zipfile
          base='a65a5912be0116564f2a5d075da5c83b0c6b9e12'
          archive=pathlib.Path(sys.argv[1])
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest=='32618114c48dec880bda4dd70e9daeb282aa508dcd664ff6c4d0856c7ee014ef'
          with zipfile.ZipFile(archive) as z:
              assert z.read('commit.txt').decode().strip()==base
              for mode in ('debug','release','tsan'):
                  prior=json.loads(z.read(f'B-RECOVERY-{mode}.json'))
                  assert prior['status']=='pass' and len(prior['recoverAppendRecoverCases'])==8
                  assert prior['directAppendBeforeRecoveryRejectedAndHealed']
          paths=['Experiments/R005Swift/Sources/SwiftProbe/'+name+'.swift' for name in
                 ('Stage005BStore','Stage005BModel','Stage005BRunner','Main','Retention','Storage','Checks')]
          paths += ['Experiments/R005Swift/'+name for name in
                    ('stage005_b_crash.py','stage005_b.py','Package.swift',
                     'Sources/ProbePlatform/include/ProbePlatform.h','Sources/ProbePlatform/platform.c')]
          for path in paths:
              assert pathlib.Path(path).read_bytes()==subprocess.check_output(['git','show',base+':'+path]),path
          report={'status':'pass','scope':'byte-identical Stage B source; prior crash proof reused, no crash rerun',
                  'source':base,'run':37503555309,'artifact':11430977253,
                  'artifactSHA256':digest,'matchedFiles':paths,'priorModes':['debug','release','tsan']}
          pathlib.Path('b-results/PRIOR-B-CRASH-PROOF.json').write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - name: Fresh Release build and full 30-day Stage B measurement
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          swift build --scratch-path .build-b-release -c release -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../b-results/build-release.txt
          python3 -B stage005_b.py .build-b-release/release/nxr-swift-probe ../../b-results/STAGE005-B.json 2>&1 | tee ../../b-results/stage005-b-run.txt
          python3 - <<'PYCODE'
          import json,pathlib
          p=pathlib.Path('../../b-results')
          b=json.loads((p/'STAGE005-B.json').read_text())
          assert b['status']=='pass' and len(b['B'])==60
          assert {k:len([r for r in b['B'] if (r['case'],r['window'])==(c,w)]) for k,c,w in
                  (('G16_W7','G16',7),('G1_W7','G1',7))}=={'G16_W7':30,'G1_W7':30}
          for case,window in (('G16',7),('G1',7)):
              assert sorted(r['day'] for r in b['B'] if (r['case'],r['window'])==(case,window))==list(range(1,31))
          assert all(all(r['invariants'].values()) for r in b['B'])
          assert set(b['cases'])=={'G16_W7','G1_W7','G1_W3'}
          assert all(v['status']=='pass' and v['totalsExact'] for v in b['finalDiskVerification'].values())
          mib=1024*1024
          snapshot=95801772 # Pinned Stage C snapshot size, not a fresh C result.
          quota={}
          for name,window,expected in (('G16_W7',7,320),('G1_W7',7,1408),('G1_W3',3,832)):
              c=b['cases'][name]
              raw=(5*((window+1)*c['BdayMax']+c['S30']+c['Omax'])+3)//4+2*snapshot
              quota[name]=((raw+64*mib-1)//(64*mib))*64
              assert quota[name]==expected,name
          assert quota['G16_W7']<=1024 and quota['G1_W7']>1024 and quota['G1_W3']<=1024
          (p/'B-QUOTA.json').write_text(json.dumps({'status':'pass','scope':'new B inputs plus pinned snapshot; not new C measurement',
             'snapshotBytesInput':snapshot,'quotaMiB':quota},indent=2)+'\n')
          (p/'scope.txt').write_text('Fresh Stage B 30 days / 60 daily records; exact unchanged B crash source and pinned prior Debug/Release/TSan proof; no C timing result.\n')
          PYCODE
      - name: Always verify source and preserve digests
        if: always()
        run: |
          set -euo pipefail
          python3 -B Checks/financial-diagnostics.py --guard --selftest > b-results/source-guard-after.txt
          bad="$(grep -rnE 'Unsafe|withUnsafe' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift' | grep -v '/Snapshot.swift:' || true)"
          test -z "$bad"
          ! grep -rnE '@unchecked Sendable|nonisolated\(unsafe\)|unowned\(unsafe\)|Unmanaged|UnsafeMutable|unsafeBitCast' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift'
          git diff --exit-code
          find Experiments/R005Swift/Sources -type f -exec shasum -a 256 {} \; > b-results/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r005-full-b-results
          path: b-results/
          if-no-files-found: error
  stage-c-functional:
    if: ${{ contains(github.event.head_commit.message, '[r005-c-functional]') && !contains(github.event.head_commit.message, '[r005-evidence-only]') && !contains(github.event.head_commit.message, '[r005-paired-profile]') && !contains(github.event.head_commit.message, '[r005-epoch-pages]') }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pin source and check production boundary
        run: |
          set -euo pipefail
          mkdir -p c-functional-results
          git rev-parse HEAD > c-functional-results/commit.txt
          git rev-parse HEAD^{tree} > c-functional-results/tree.txt
          swift --version > c-functional-results/environment.txt
          xcodebuild -version >> c-functional-results/environment.txt
          python3 -B Checks/financial-diagnostics.py --guard --selftest > c-functional-results/source-guard-before.txt
          python3 -B -m unittest discover -s Experiments/R005Swift/tests -v > c-functional-results/proof-gates.txt 2>&1
      - name: Build Debug Release and TSan C
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          swift build --scratch-path .build-c-functional-debug -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../c-functional-results/build-debug.txt
          swift build --scratch-path .build-c-functional-release -c release -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../c-functional-results/build-release.txt
          swift build --scratch-path .build-c-functional-tsan --sanitize=thread -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../c-functional-results/build-tsan.txt
      - name: WAL resume and 1M K1-K10 in Debug Release TSan S and H
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          for mode in debug release tsan; do
            bin=".build-c-functional-$mode/$([ "$mode" = release ] && echo release || echo debug)/nxr-swift-probe"
            for variant in S H; do
              fixture="../../c-functional-results/wal-$mode-$variant"
              if [ "$mode" = tsan ]; then
                TSAN_OPTIONS=halt_on_error=1 "$bin" stage-c-wal-continuation "$fixture" "$variant" > "../../c-functional-results/wal-$mode-$variant.json" 2> "../../c-functional-results/wal-$mode-$variant-stderr.txt"
                TSAN_OPTIONS=halt_on_error=1 python3 -B stage005_c_crash.py "$bin" "../../c-functional-results/kills-$mode-$variant.json" "$variant" 2>&1 | tee "../../c-functional-results/kills-$mode-$variant.txt"
              else
                "$bin" stage-c-wal-continuation "$fixture" "$variant" > "../../c-functional-results/wal-$mode-$variant.json"
                python3 -B stage005_c_crash.py "$bin" "../../c-functional-results/kills-$mode-$variant.json" "$variant" 2>&1 | tee "../../c-functional-results/kills-$mode-$variant.txt"
              fi
              rm -rf "$fixture"
            done
          done
          echo 'Functional WAL continuation, Debug/Release/TSan S/H 1M K1-K10 only; no 100-save timing or C acceptance.' > ../../c-functional-results/scope.txt
      - name: Always verify source and preserve digests
        if: always()
        run: |
          set -euo pipefail
          python3 -B Checks/financial-diagnostics.py --guard --selftest > c-functional-results/source-guard-after.txt
          bad="$(grep -rnE 'Unsafe|withUnsafe' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift' | grep -v '/Snapshot.swift:' || true)"
          test -z "$bad"
          ! grep -rnE '@unchecked Sendable|nonisolated\(unsafe\)|unowned\(unsafe\)|Unmanaged|UnsafeMutable|unsafeBitCast' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift'
          git diff --exit-code
          find Experiments/R005Swift/Sources -type f -exec shasum -a 256 {} \; > c-functional-results/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r005-c-functional-results
          path: c-functional-results/
          if-no-files-found: error
  epoch-pages-micro:
    if: ${{ contains(github.event.head_commit.message, '[r005-epoch-pages]') && !contains(github.event.head_commit.message, '[r005-evidence-only]') && !contains(github.event.head_commit.message, '[r005-micro]') && !contains(github.event.head_commit.message, '[r005-c-targeted]') && !contains(github.event.head_commit.message, '[r005-b-full]') && !contains(github.event.head_commit.message, '[r005-c-functional]') && !contains(github.event.head_commit.message, '[r005-paired-profile]') }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pin source and unchanged hot layouts
        run: |
          set -euo pipefail
          mkdir -p epoch-results
          git rev-parse HEAD > epoch-results/commit.txt
          git rev-parse HEAD^{tree} > epoch-results/tree.txt
          swift --version > epoch-results/environment.txt
          xcodebuild -version >> epoch-results/environment.txt
          sw_vers >> epoch-results/environment.txt
          sysctl hw.model hw.memsize hw.ncpu >> epoch-results/environment.txt
          python3 -B Checks/financial-diagnostics.py --guard --selftest > epoch-results/source-guard-before.txt
          python3 -B -m unittest discover -s Experiments/R005Swift/tests -v > epoch-results/proof-gates.txt 2>&1
          shasum -a 256 Experiments/R005Swift/Sources/SwiftProbe/{Core,Hybrid,Snapshot,Stage005CSave,Stage005CRunner,Stage005CHybridRunner,Stage005CWAL}.swift > epoch-results/hot-layout-source.txt
      - name: Build isolated ownership micro in Debug Release TSan
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          swift build --scratch-path .build-epoch-debug -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../epoch-results/build-debug.txt
          swift build --scratch-path .build-epoch-release -c release -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../epoch-results/build-release.txt
          swift build --scratch-path .build-epoch-tsan --sanitize=thread -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../epoch-results/build-tsan.txt
          cc -dynamiclib -O2 -Wall -Wextra -Werror AllocationObserver.c -ISources/ProbePlatform/include -o ../../epoch-results/AllocationObserver.dylib
      - name: Bounded 4096 ownership and allocator micro first
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          export NXR_ALLOCATOR_DYLIB="$PWD/../../epoch-results/AllocationObserver.dylib"
          for mode in debug release tsan; do
            config=debug
            if test "$mode" = release; then config=release; fi
            bin=".build-epoch-$mode/$config/nxr-swift-probe"
            TSAN_OPTIONS=halt_on_error=1 DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" "$bin" epoch-pages-micro "../../epoch-results/store-$mode" 4096 > "../../epoch-results/EPOCH-4096-$mode.json" 2> "../../epoch-results/EPOCH-4096-$mode.stderr.txt"
            rm -rf "../../epoch-results/store-$mode"
          done
          python3 -B verify_epoch_micro.py ../../epoch-results/EPOCH-4096-{debug,release,tsan}.json > ../../epoch-results/micro-4096-validation.txt
      - name: Release 100k only after bounded ownership validation
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          export NXR_ALLOCATOR_DYLIB="$PWD/../../epoch-results/AllocationObserver.dylib"
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" .build-epoch-release/release/nxr-swift-probe epoch-pages-micro ../../epoch-results/store-100k 100000 > ../../epoch-results/EPOCH-100k-release.json 2> ../../epoch-results/EPOCH-100k-release.stderr.txt
          python3 -B verify_epoch_micro.py ../../epoch-results/EPOCH-100k-release.json > ../../epoch-results/micro-100k-validation.txt
          rm -rf ../../epoch-results/store-100k
      - name: Always verify source and retain the diagnostic scope
        if: always()
        run: |
          set -euo pipefail
          python3 -B Checks/financial-diagnostics.py --guard --selftest > epoch-results/source-guard-after.txt
          bad="$(grep -rnE 'Unsafe|withUnsafe' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift' | grep -v '/Snapshot.swift:' || true)"
          test -z "$bad"
          ! grep -rnE '@unchecked Sendable|nonisolated\(unsafe\)|unowned\(unsafe\)|Unmanaged|UnsafeMutable|unsafeBitCast' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift'
          git diff --exit-code
          find Experiments/R005Swift/Sources -type f -exec shasum -a 256 {} \; > epoch-results/source-sha256.txt
          echo 'Isolated asset-page ownership micro only; no S/H state changes, A/B reuse, C acceptance or 1M100-save campaign. All historical failures and 1.10 stay unchanged.' > epoch-results/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r005-epoch-pages-micro
          path: epoch-results/
          if-no-files-found: error
  stage-c-paired-profile:
    if: ${{ contains(github.event.head_commit.message, '[r005-paired-profile]') && !contains(github.event.head_commit.message, '[r005-evidence-only]') && !contains(github.event.head_commit.message, '[r005-micro]') && !contains(github.event.head_commit.message, '[r005-c-targeted]') && !contains(github.event.head_commit.message, '[r005-b-full]') && !contains(github.event.head_commit.message, '[r005-c-functional]') && !contains(github.event.head_commit.message, '[r005-epoch-pages]') }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pin source and guard the diagnostic scope
        run: |
          set -euo pipefail
          mkdir -p paired-results
          git rev-parse HEAD > paired-results/commit.txt
          git rev-parse HEAD^{tree} > paired-results/tree.txt
          swift --version > paired-results/environment.txt
          xcodebuild -version >> paired-results/environment.txt
          sw_vers >> paired-results/environment.txt
          python3 -B Checks/financial-diagnostics.py --guard --selftest > paired-results/source-guard-before.txt
          python3 -B -m unittest discover -s Experiments/R005Swift/tests -v > paired-results/proof-gates.txt 2>&1
      - name: Build and run bounded paired S diagnostic
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          swift build --scratch-path .build-paired-debug -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../paired-results/build-debug.txt
          swift build --scratch-path .build-paired-release -c release -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../paired-results/build-release.txt
          cc -dynamiclib -O2 -Wall -Wextra -Werror AllocationObserver.c -ISources/ProbePlatform/include -o ../../paired-results/AllocationObserver.dylib
          trap 'rm -rf ../../paired-results/smoke-debug-store ../../paired-results/smoke-release-store ../../paired-results/profile-s-store' EXIT
          export NXR_ALLOCATOR_DYLIB="$PWD/../../paired-results/AllocationObserver.dylib"
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" .build-paired-debug/debug/nxr-swift-probe stage-c-paired-profile-smoke ../../paired-results/smoke-debug-store S > ../../paired-results/PAIRED-PROFILE-SMOKE-debug.json 2> ../../paired-results/PAIRED-PROFILE-SMOKE-debug.stderr.txt
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" .build-paired-release/release/nxr-swift-probe stage-c-paired-profile-smoke ../../paired-results/smoke-release-store S > ../../paired-results/PAIRED-PROFILE-SMOKE-release.json 2> ../../paired-results/PAIRED-PROFILE-SMOKE-release.stderr.txt
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" .build-paired-release/release/nxr-swift-probe stage-c-paired-profile ../../paired-results/profile-s-store S > ../../paired-results/PAIRED-PROFILE-S.json 2> ../../paired-results/PAIRED-PROFILE-S.stderr.txt
          python3 - <<'PYCODE'
          import json, pathlib
          p=pathlib.Path('../../paired-results')
          for name,assets,pairs in (('PAIRED-PROFILE-SMOKE-debug.json',4096,1),
                                    ('PAIRED-PROFILE-SMOKE-release.json',4096,1),
                                    ('PAIRED-PROFILE-S.json',1000000,2)):
              value=json.loads((p/name).read_text())
              assert value['status']=='diagnostic' and value['acceptance'] is False
              assert value['variant']=='S' and value['assets']==assets
              assert 'diagnostic only' in value['instrumentation']
              assert len(value['pairs'])==pairs
              boundary=value['fixture']['saveStartCall']
              assert value['fixture']['postBoundaryNoSave']=='installed idle StageCState'
              for pair in value['pairs']:
                  assert pair['logicalTranscriptExact'] is True
                  assert pair['outputHashExact'] is True
                  assert pair['finalDigestExact'] is True
                  assert pair['stateInstallAligned'] is True
                  legs=pair['legs']
                  assert len(legs)==2 and {leg['saveEnabled'] for leg in legs}=={False,True}
                  no_save=next(leg for leg in legs if not leg['saveEnabled'])
                  save=next(leg for leg in legs if leg['saveEnabled'])
                  assert no_save['postBoundaryControlStateInstalled'] is True
                  assert save['postBoundaryControlStateInstalled'] is False
                  assert all(leg['stateInstallAfterAdvanceCalls']==boundary for leg in legs)
                  assert all(leg['recoveryExact'] is True for leg in legs)
                  assert no_save['finalDigest']==save['finalDigest']==no_save['recoveryDigest']==save['recoveryDigest']
                  assert no_save['outputHash']==save['outputHash']
                  assert no_save['writer']=={'started':False}
                  assert save['writer']['allocationObserverAvailable'] is True
                  for field in ('runNS','dispatchToRunNS','queueWaitNS','recordProcessWriteNS','finalizeNS'):
                      assert isinstance(save['writer'][field],int) and save['writer'][field]>=0
                  for leg in legs:
                      setup=leg['simulationThread']['setup']
                      assert isinstance(setup['stateInstall']['allocations'],int)
                      assert set(leg['walLifecycle'])=={'resume','transitionClose','transitionOpen','finalClose'}
                      assert all(isinstance(leg['walLifecycle'][phase]['allocations'],int)
                                 for phase in leg['walLifecycle'])
                  assert no_save['simulationThread']['setup']['snapshotSink']=={'started':False}
                  assert no_save['simulationThread']['setup']['beginSave']=={'started':False}
                  assert 'allocations' in save['simulationThread']['setup']['snapshotSink']
                  assert 'allocations' in save['simulationThread']['setup']['beginSave']
                  assert all(call['stateMode']=='notInstalled' for call in no_save['calls'][:boundary])
                  assert all(call['stateMode']=='idleInstalled' for call in no_save['calls'][boundary:])
          (p/'paired-profile-scope.txt').write_text(
              'Fixed-fixture S paired diagnostic only: Debug/Release 4096 smoke then Release 1M ABBA save/no-save pairs. '
              'Writer timings include per-record clocks and allocation observation, so are not uninstrumented production-C timing. '
              'No Stage C 100-save evaluator, A/B reuse, K1-K10, or acceptance claim ran. C remains open on S and H.\\n')
          PYCODE
      - name: Always verify source and preserve diagnostic identity
        if: always()
        run: |
          set -euo pipefail
          python3 -B Checks/financial-diagnostics.py --guard --selftest > paired-results/source-guard-after.txt
          bad="$(grep -rnE 'Unsafe|withUnsafe' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift' | grep -v '/Snapshot.swift:' || true)"
          test -z "$bad"
          ! grep -rnE '@unchecked Sendable|nonisolated\(unsafe\)|unowned\(unsafe\)|Unmanaged|UnsafeMutable|unsafeBitCast' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift'
          git diff --exit-code
          find Experiments/R005Swift/Sources -type f -exec shasum -a 256 {} \; > paired-results/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r005-paired-profile-results
          path: paired-results/
          if-no-files-found: error
  stage-c:
    if: ${{ (contains(github.event.head_commit.message, '[r005-micro]') || contains(github.event.head_commit.message, '[r005-c-targeted]')) && !contains(github.event.head_commit.message, '[r005-evidence-only]') && !contains(github.event.head_commit.message, '[r005-b-full]') && !contains(github.event.head_commit.message, '[r005-c-functional]') && !contains(github.event.head_commit.message, '[r005-paired-profile]') && !contains(github.event.head_commit.message, '[r005-epoch-pages]') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Source identity and production guard before execution
        run: |
          set -euo pipefail
          mkdir -p c-results
          git rev-parse HEAD > c-results/commit.txt
