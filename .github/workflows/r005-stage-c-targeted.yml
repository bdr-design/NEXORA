name: R005 bounded micro and targeted C proof
on:
  push:
    branches: ["diagnostic/r005-design-1m-20260930"]
permissions:
  contents: read
  actions: read
jobs:
  stage-c:
    if: ${{ contains(github.event.head_commit.message, '[r005-micro]') || contains(github.event.head_commit.message, '[r005-c-targeted]') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Source identity and production guard before execution
        run: |
          set -euo pipefail
          mkdir -p c-results
          git rev-parse HEAD > c-results/commit.txt
          git rev-parse HEAD^{tree} > c-results/tree.txt
          swift --version > c-results/environment.txt
          xcodebuild -version >> c-results/environment.txt
          python3 -B Checks/financial-diagnostics.py --guard --selftest > c-results/source-guard-before.txt
          python3 -B -m unittest discover -s Experiments/R005Swift/tests -v > c-results/proof-gates.txt 2>&1
      - name: Fetch and verify pinned unchanged A and B evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin fa9c44656d6a7544f5cd0255781c64fde3e9ce1f
          gh api repos/bdr-design/NEXORA/actions/artifacts/11170911262/zip > c-results/prior-ab.zip
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          p=pathlib.Path('c-results/prior-ab.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='6517060278e24e0a8b3bdb0db0476ebe719543eac293bcb2b903dc22fc356d71'
          with zipfile.ZipFile(p) as z: z.extractall('c-results/prior-ab')
          PY
          python3 -B Experiments/R005Swift/verify_reused_ab.py c-results/prior-ab c-results/REUSED-AB.json
          cp c-results/prior-ab/STAGE005-A.json c-results/STAGE005-A.json
      - name: Build Debug and Release C and allocator observer
        if: ${{ !contains(github.event.head_commit.message, '[r005-micro-recover]') && !contains(github.event.head_commit.message, '[r005-transport-verify]') }}
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          swift build --scratch-path .build-c-debug -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../c-results/build-debug.txt
          swift build --scratch-path .build-c-release -c release -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../c-results/build-release.txt
          cc -dynamiclib -O2 -Wall -Wextra -Werror AllocationObserver.c -ISources/ProbePlatform/include -o ../../c-results/AllocationObserver.dylib
      - name: Debug and Release transport lifecycle and exact 100k restore checks
        if: ${{ !contains(github.event.head_commit.message, '[r005-micro-recover]') && !contains(github.event.head_commit.message, '[r005-transport-verify]') }}
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          for mode in debug release; do
            bin=".build-c-$mode/$mode/nxr-swift-probe"
            "$bin" stage-c-transport-checks "../../c-results/transport-$mode" > "../../c-results/transport-$mode.json"
            for variant in S H; do
              "$bin" stage-c-smoke "../../c-results/smoke-$mode-$variant" "$variant" 100000 > "../../c-results/smoke-$mode-$variant.json"
              rm -rf "../../c-results/smoke-$mode-$variant"
            done
            rm -rf "../../c-results/transport-$mode"
          done
      - name: Bounded diagnostic micro only
        if: ${{ contains(github.event.head_commit.message, '[r005-micro]') && !contains(github.event.head_commit.message, '[r005-micro-recover]') && !contains(github.event.head_commit.message, '[r005-transport-verify]') && !contains(github.event.head_commit.message, '[r005-profile]') }}
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          trap 'rm -rf ../../c-results/components-store ../../c-results/micro-s ../../c-results/micro-h' EXIT
          export NXR_ALLOCATOR_DYLIB="$PWD/../../c-results/AllocationObserver.dylib"
          bin=.build-c-release/release/nxr-swift-probe
          for variant in S H; do
            DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" "$bin" stage-c-allocation-probes "$variant" > "../../c-results/allocation-probes-$variant.json"
          done
          for mode in debug release; do
            python3 -B stage005_c_mid_record.py ".build-c-$mode/$mode/nxr-swift-probe" "../../c-results/mid-record-$mode.json"
          done
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" "$bin" stage-c-micro-components ../../c-results/components-store > ../../c-results/MICRO-COMPONENTS.json
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" "$bin" stage-c-micro ../../c-results/micro-s S > ../../c-results/MICRO-S.json
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" "$bin" stage-c-micro ../../c-results/micro-h H > ../../c-results/MICRO-H.json
          rm -rf ../../c-results/components-store ../../c-results/micro-s ../../c-results/micro-h
      - name: Same-run phase diagnosis and advisory call-stack sample on S
        if: contains(github.event.head_commit.message, '[r005-profile]')
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          trap 'rm -rf ../../c-results/profile-store ../../c-results/profile-sampled-store' EXIT
          export NXR_ALLOCATOR_DYLIB="$PWD/../../c-results/AllocationObserver.dylib"
          bin=.build-c-release/release/nxr-swift-probe
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" "$bin" stage-c-micro ../../c-results/profile-store S > ../../c-results/PROFILE-S.json
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" "$bin" stage-c-micro ../../c-results/profile-sampled-store S > ../../c-results/PROFILE-S-SAMPLED.json &
          probe_pid=$!
          if sample "$probe_pid" 3 1 -mayDie -file ../../c-results/profile-stacks.txt > ../../c-results/sampler-log.txt 2>&1; then
            echo 0 > ../../c-results/sampler-exit-status.txt
          else
            echo $? > ../../c-results/sampler-exit-status.txt
          fi
          wait "$probe_pid"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('../../c-results')
          for name in ('PROFILE-S.json','PROFILE-S-SAMPLED.json'):
              d=json.loads((p/name).read_text())
              assert d['status']=='diagnostic' and d['saves']==5
              print(name, json.dumps(d['simulationPhases']))
          (p/'profile-scope.txt').write_text('Uninstrumented PROFILE-S is bounded diagnosis only. PROFILE-S-SAMPLED is under an advisory sampler and cannot establish a timing improvement or C acceptance. Original C thresholds/calculation remain unchanged.\n')
          PY
      - name: Recover completed micro metrics without repeating measurement
        if: ${{ contains(github.event.head_commit.message, '[r005-micro-recover]') && !contains(github.event.head_commit.message, '[r005-qos-recover]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/bdr-design/NEXORA/actions/artifacts/11344981195/zip > "$RUNNER_TEMP/prior-micro.zip"
          python3 - "$RUNNER_TEMP/prior-micro.zip" <<'PYCODE'
          import hashlib,json,pathlib,sys,zipfile
          p=pathlib.Path(sys.argv[1])
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='c52baa28d44246931581d073782afe455b241d71c642f0fa30f4e9d5d912c812'
          dest=pathlib.Path('c-results/prior-micro');dest.mkdir()
          with zipfile.ZipFile(p) as z:
              for name in ('MICRO-COMPONENTS.json','MICRO-S.json','MICRO-H.json','commit.txt','tree.txt'):
                  (dest/name).write_bytes(z.read(name))
          assert (dest/'commit.txt').read_text().strip()=='1abc2fa11bd2160672b1467ed6c392e528fd7ecd'
          for name in ('MICRO-S.json','MICRO-H.json'):
              c=json.loads((dest/name).read_text())
              assert c['status']=='diagnostic' and c['saves']==5
              print(json.dumps({'variant':c['variant'],'overheadRatio':c['overheadRatio'],
                  'barrierNS':c['barrierCopy']['nsPerSave'],'pairs':c['allocationPairing']}))
          PYCODE
      - name: Recover failed priority-run evidence and verify exact transport rollback
        if: contains(github.event.head_commit.message, '[r005-qos-recover]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin 3b3711de3123f85980dd100e35cae2b3e998a4de
          gh api repos/bdr-design/NEXORA/actions/artifacts/11348271339/zip > "$RUNNER_TEMP/prior-qos.zip"
          python3 - "$RUNNER_TEMP/prior-qos.zip" <<'PYCODE'
          import hashlib,json,pathlib,subprocess,sys,zipfile
          p=pathlib.Path(sys.argv[1])
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='4978fd9a2040e2af497a2d3c1276d00275d169b30b8baeb84635dbf11645f53d'
          dest=pathlib.Path('c-results/prior-qos');dest.mkdir()
          with zipfile.ZipFile(p) as z:
              for name in z.namelist():
                  if '/' not in name and name.endswith(('.json','.txt')):
                      (dest/name).write_bytes(z.read(name))
          assert (dest/'commit.txt').read_text().strip()=='ec695084cba1aa63a563602549c2a96f80418cc9'
          assert (dest/'tree.txt').read_text().strip()=='569a5c6bb43794ae9964155882fd37fe33acb397'
          for name in ('Snapshot.swift','Stage005CSave.swift','Stage005CRunner.swift','Stage005CHybridRunner.swift'):
              path='Experiments/R005Swift/Sources/SwiftProbe/'+name
              prior=subprocess.check_output(['git','show','3b3711de3123f85980dd100e35cae2b3e998a4de:'+path])
              assert pathlib.Path(path).read_bytes()==prior,path
          report={'status':'pass','scope':'evidence extraction and byte-equal rollback, not new measurement',
                  'failedRun':37316669619,'failedRunStatus':'failure','artifact':11348271339,
                  'artifactSHA256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'restoredTransportSource':'3b3711de3123f85980dd100e35cae2b3e998a4de',
                  'reusedFiles':4,'extractedFiles':len(list(dest.iterdir()))}
          pathlib.Path('c-results/RECOVERED-QOS.json').write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - name: Bounded TSan transport verification without new overhead measurement
        if: contains(github.event.head_commit.message, '[r005-transport-verify]')
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          swift build --scratch-path .build-c-tsan --sanitize=thread -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../c-results/build-tsan.txt
          bin=.build-c-tsan/debug/nxr-swift-probe
          TSAN_OPTIONS=halt_on_error=1 "$bin" stage-c-transport-checks ../../c-results/transport-tsan > ../../c-results/transport-tsan.json 2> ../../c-results/transport-tsan-stderr.txt
          for variant in S H; do
            TSAN_OPTIONS=halt_on_error=1 "$bin" stage-c-smoke "../../c-results/smoke-tsan-$variant" "$variant" 100000 > "../../c-results/smoke-tsan-$variant.json" 2> "../../c-results/smoke-tsan-$variant-stderr.txt"
            rm -rf "../../c-results/smoke-tsan-$variant"
          done
          rm -rf ../../c-results/transport-tsan
      - name: Selected-layout allocation smoke, recovery and C gates
        if: contains(github.event.head_commit.message, '[r005-c-targeted]')
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          export NXR_ALLOCATOR_DYLIB="$PWD/../../c-results/AllocationObserver.dylib"
          variant="$(python3 -c 'import json; print(json.load(open("../../c-results/STAGE005-A.json"))["decisionA"]["chosen"])')"
          bin=.build-c-release/release/nxr-swift-probe
          DYLD_INSERT_LIBRARIES="$NXR_ALLOCATOR_DYLIB" "$bin" stage-c-allocation-probes "$variant" > ../../c-results/allocation-probes.json
          "$bin" stage-c-smoke ../../c-results/smoke "$variant" 100000 > ../../c-results/smoke.json
          rm -rf ../../c-results/smoke
          python3 -B stage005_c_crash.py .build-c-debug/debug/nxr-swift-probe ../../c-results/STAGE005-C-KILLS-debug.json "$variant" 2>&1 | tee ../../c-results/kills-debug.txt
          python3 -B stage005_c_crash.py "$bin" ../../c-results/STAGE005-C-KILLS-release.json "$variant" 2>&1 | tee ../../c-results/kills-release.txt
          swift build --scratch-path .build-c-tsan --sanitize=thread -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../c-results/build-tsan.txt
          python3 -B stage005_c_crash.py .build-c-tsan/debug/nxr-swift-probe ../../c-results/STAGE005-C-KILLS-tsan.json "$variant" 2>&1 | tee ../../c-results/kills-tsan.txt
          python3 -B stage005_c.py "$bin" ../../c-results/STAGE005-C.json ../../c-results/STAGE005-A.json 2>&1 | tee ../../c-results/c-run.txt
      - name: Always enforce source and unsafe boundaries and retain digests
        if: always()
        run: |
          set -euo pipefail
          python3 -B Checks/financial-diagnostics.py --guard --selftest > c-results/source-guard-after.txt
          bad="$(grep -rnE 'Unsafe|withUnsafe' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift' | grep -v '/Snapshot.swift:' || true)"
          test -z "$bad"
          ! grep -rnE '@unchecked Sendable|nonisolated\(unsafe\)|unowned\(unsafe\)|Unmanaged|UnsafeMutable|unsafeBitCast' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift'
          git diff --exit-code
          find Experiments/R005Swift/Sources -type f -exec shasum -a 256 {} \; > c-results/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r005-targeted-c-results
          path: c-results/
          if-no-files-found: error
