name: R005 bounded immutable full-state candidate
on:
  push:
    branches: ["diagnostic/r005-design-1m-20260930"]
permissions:
  contents: read
jobs:
  bounded-paged-candidate:
    if: ${{ contains(github.event.head_commit.message, '[r005-paged-candidate]') && contains(github.event.head_commit.message, '[r005-evidence-only]') && !contains(github.event.head_commit.message, '[r005-c-targeted]') && !contains(github.event.head_commit.message, '[r005-epoch-pages]') && !contains(github.event.head_commit.message, '[r005-micro]') && !contains(github.event.head_commit.message, '[r005-page-stamp-study]') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Record source and build flags before execution
        run: |
          set -euo pipefail
          mkdir -p paged-results
          git rev-parse HEAD > paged-results/commit.txt
          git rev-parse HEAD^{tree} > paged-results/tree.txt
          swift --version > paged-results/environment.txt
          xcodebuild -version >> paged-results/environment.txt
          sw_vers >> paged-results/environment.txt
          sysctl hw.model hw.ncpu hw.memsize >> paged-results/environment.txt
          printf '%s\n' 'baseline: STAGE_C' 'candidate: STAGE_C EPOCH_PAGES' 'scope: diagnostic only; no A/B/C reuse or evaluator' > paged-results/build-flags.txt
          python3 -B Checks/financial-diagnostics.py --guard --selftest > paged-results/source-guard-before.txt
          python3 -B -m unittest discover -s Experiments/R005Swift/tests -v > paged-results/proof-gates.txt 2>&1
      - name: Build both owners and the candidate with Thread Sanitizer
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          swift build --scratch-path .build-paged-base-debug -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../paged-results/build-base-debug.txt
          swift build --scratch-path .build-paged-base-release -c release -Xswiftc -DSTAGE_C -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../paged-results/build-base-release.txt
          swift build --scratch-path .build-paged-debug -Xswiftc -DSTAGE_C -Xswiftc -DEPOCH_PAGES -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../paged-results/build-candidate-debug.txt
          swift build --scratch-path .build-paged-release -c release -Xswiftc -DSTAGE_C -Xswiftc -DEPOCH_PAGES -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../paged-results/build-candidate-release.txt
          swift build --scratch-path .build-paged-tsan --sanitize=thread -Xswiftc -DSTAGE_C -Xswiftc -DEPOCH_PAGES -Xswiftc -warnings-as-errors -Xcc -Werror 2>&1 | tee ../../paged-results/build-candidate-tsan.txt
          cc -dynamiclib -O2 -Wall -Wextra -Werror AllocationObserver.c -ISources/ProbePlatform/include -o ../../paged-results/AllocationObserver.dylib
      - name: Existing order, rejection and v2 transport checks in Debug Release TSan
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          for mode in debug release tsan; do
            config="$mode"
            if test "$mode" = tsan; then config=debug; fi
            bin=".build-paged-$mode/$config/nxr-swift-probe"
            export TSAN_OPTIONS=halt_on_error=1
            "$bin" selftest > "../../paged-results/selftest-$mode.json"
            "$bin" hybrid-selftest > "../../paged-results/hybrid-layout-$mode.json"
            "$bin" hybrid-mutants > "../../paged-results/hybrid-mutants-$mode.json"
            "$bin" order 4096 > "../../paged-results/order-$mode.json"
            "$bin" hybrid-order 4096 > "../../paged-results/hybrid-order-$mode.json"
            "$bin" stage-c-transport-checks "../../paged-results/transport-$mode" > "../../paged-results/transport-$mode.json"
            rm -rf "../../paged-results/transport-$mode"
            for variant in S H; do
              "$bin" paged-candidate-lifecycle "../../paged-results/lifecycle-$mode-$variant" "$variant" > "../../paged-results/lifecycle-$mode-$variant.json" 2> "../../paged-results/lifecycle-$mode-$variant.stderr.txt"
              rm -rf "../../paged-results/lifecycle-$mode-$variant"
            done
          done
      - name: Compare legacy and candidate canonical files, epochs, WAL and allocation observations
        run: |
          set -euo pipefail
          cd Experiments/R005Swift
          python3 -B paged_candidate.py .build-paged-base-release/release/nxr-swift-probe .build-paged-debug/debug/nxr-swift-probe .build-paged-release/release/nxr-swift-probe .build-paged-tsan/debug/nxr-swift-probe ../../paged-results/matrix ../../paged-results/AllocationObserver.dylib 2>&1 | tee ../../paged-results/matrix-run.txt
      - name: Read only the permitted previous paged source for paired diagnosis
        uses: actions/checkout@v4
        with:
          ref: 36675c8163191b58b6d39fe64654ee0327372165
          path: .previous-paged-source
          persist-credentials: false
          fetch-depth: 1
      - name: Same-host old and new H 100k ABBA bounded comparison
        run: |
          set -euo pipefail
          trap 'rm -rf .previous-paged-source' EXIT
          test "$(git -C .previous-paged-source rev-parse HEAD)" = 36675c8163191b58b6d39fe64654ee0327372165
          python3 -B .previous-paged-source/Experiments/R005Swift/candidate_proof_inputs.py write paged-results/previous-runtime-inputs.json
          python3 -B Experiments/R005Swift/candidate_proof_inputs.py write paged-results/runtime-inputs.json
          python3 -B - <<'PYCODE'
          import hashlib,json,pathlib
          assert hashlib.sha256(pathlib.Path('paged-results/previous-runtime-inputs.json').read_bytes()).hexdigest()=='f0c7c36513c810957189aee1b56a60ed95022f1188d446435d0bf685fabcd77f'
          old=json.loads(pathlib.Path('paged-results/previous-runtime-inputs.json').read_text())
          new=json.loads(pathlib.Path('paged-results/runtime-inputs.json').read_text())
          assert old['sourceFlags']==new['sourceFlags'] and set(old['paths'])==set(new['paths'])
          changed={p for p in old['paths'] if old['paths'][p]!=new['paths'][p]}
          expected={'Experiments/R005Swift/Sources/SwiftProbe/'+f for f in
              ('EpochPages.swift','Core.swift','Hybrid.swift','Stage005CSave.swift','Stage005CPagedChecks.swift')}
          assert changed==expected,(changed,expected)
          PYCODE
          (cd .previous-paged-source/Experiments/R005Swift && swift build --scratch-path .build-previous -c release -Xswiftc -DSTAGE_C -Xswiftc -DEPOCH_PAGES -Xswiftc -warnings-as-errors -Xcc -Werror) 2>&1 | tee paged-results/build-previous-paged-release.txt
          python3 -B - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,statistics,subprocess,sys
          sys.path.insert(0,'Experiments/R005Swift')
          from paged_candidate import validate,comparable
          p=pathlib.Path('paged-results/accessor-comparison');p.mkdir()
          bins={'old':pathlib.Path('.previous-paged-source/Experiments/R005Swift/.build-previous/release/nxr-swift-probe').resolve(),
              'new':pathlib.Path('Experiments/R005Swift/.build-paged-release/release/nxr-swift-probe').resolve()}
          env=os.environ.copy();env['DYLD_INSERT_LIBRARIES']=str(pathlib.Path('paged-results/AllocationObserver.dylib').resolve())
          rows=[];reference=None
          for ordinal,arm in enumerate(('old','new','new','old'),1):
              label=f'{ordinal}-{arm}';store=(p/f'store-{label}').resolve()
              result=subprocess.run([str(bins[arm]),'paged-candidate-checks',str(store),'H','100000','zero'],env=env,text=True,capture_output=True,timeout=900)
              f=p/f'{label}.json';f.write_text(result.stdout);(p/f'{label}.stderr.txt').write_text(result.stderr)
              assert result.returncode==0 and not result.stderr,(arm,result.stderr)
              row=json.loads(result.stdout);validate(row,variant='H',count=100000,policy='zero',candidate=True)
              if reference is None:reference=comparable(row)
              else:assert comparable(row)==reference
              expected_bytes=8050000
              assert all(epoch['barrierBytes']==expected_bytes for epoch in row['epochs'])
              rows.append({'arm':arm,'file':f.name,'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),
                  'advanceNS':[e['advanceNS'] for e in row['epochs']],
                  'barrierNS':[e['barrierNS'] for e in row['epochs']],
                  'barrierBytes':[e['barrierBytes'] for e in row['epochs']],
                  'fullLoopNS':[e['fullLoopNS'] for e in row['epochs']]})
              shutil.rmtree(store)
          old=statistics.median(n for row in rows if row['arm']=='old' for n in row['advanceNS'])
          new=statistics.median(n for row in rows if row['arm']=='new' for n in row['advanceNS'])
          report={'status':'diagnostic-verified','acceptance':False,'layout':'H','assets':100000,
              'order':['old','new','new','old'],'rows':rows,'medianAdvanceNS':{'old':old,'new':new},
              'diagnosticNewToOldRatio':new/old,'C100':'NOT_RUN',
              'scope':'same-host bounded mirror/order/WAL test, not pure simulation timing or A/C acceptance; no pacing or idle padding'}
          (p/'ACCESSOR-COMPARISON.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PYCODE
      - name: Always enforce source and unsafe boundaries
        if: always()
        run: |
          set -euo pipefail
          python3 -B Checks/financial-diagnostics.py --guard --selftest > paged-results/source-guard-after.txt
          bad="$(grep -rnE 'Unsafe|withUnsafe' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift' | grep -v '/Snapshot.swift:' || true)"
          test -z "$bad"
          ! grep -rnE '@unchecked Sendable|nonisolated\(unsafe\)|unowned\(unsafe\)|Unmanaged|UnsafeMutable|unsafeBitCast' Experiments/R005Swift/Sources/SwiftProbe --include='*.swift'
          git diff --exit-code
          find Experiments/R005Swift/Sources -type f -exec shasum -a 256 {} \; > paged-results/source-sha256.txt
          echo 'Conditional full-state integration only. Historical failures retained; C OPEN on S/H. A/B/1M K1-K10 and C100 not run.' > paged-results/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r005-paged-candidate-results
          path: paged-results/
          if-no-files-found: error
