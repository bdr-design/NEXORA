name: NEXORA Restart Gates

on:
  push:
    branches: ["rebuild/native-r001", "foundation/clean-core"]
  pull_request:
    branches: ["main", "foundation/clean-core"]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source and toolchain identity
        run: |
          mkdir -p local-evidence
          git rev-parse HEAD > local-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > local-evidence/source-tree.txt
          swift --version > local-evidence/toolchain.txt
          xcodebuild -version >> local-evidence/toolchain.txt
      - name: Debug contracts
        run: |
          set -o pipefail
          swift test -Xswiftc -warnings-as-errors 2>&1 | tee local-evidence/debug.txt
      - name: Release contracts
        run: |
          set -o pipefail
          swift test -c release -Xswiftc -warnings-as-errors 2>&1 | tee local-evidence/release.txt
      - name: Compiler ownership boundaries
        run: |
          set -o pipefail
          bash Checks/verify.sh 2>&1 | tee local-evidence/compiler-gates.txt
      - name: Thread Sanitizer
        run: |
          set -o pipefail
          swift test --sanitize=thread -Xswiftc -warnings-as-errors 2>&1 | tee local-evidence/tsan.txt
      - name: iOS identity and observability compile gates
        run: |
          set -o pipefail
          for scheme in NexoraIdentity NexoraObservability; do
            xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build 2>&1 | tee "local-evidence/ios-$scheme.txt"
          done
      - name: Identity lifecycle smoke, not gameplay benchmark
        run: |
          set -o pipefail
          swift run -c release nexora-check --json local-evidence/identity-smoke.json 2>&1 | tee local-evidence/smoke.txt
          git diff --exit-code
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-r001-evidence
          path: local-evidence/
          if-no-files-found: error
