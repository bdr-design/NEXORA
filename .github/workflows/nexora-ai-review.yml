name: NEXORA Free Model Review
on:
  push:
    branches: [tooling/nexora-ai-review-20261011]
    paths:
      - Tools/AIReview/**
      - .github/workflows/nexora-ai-review.yml
permissions:
  contents: read
concurrency:
  group: nexora-free-model-review
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'bdr-design/NEXORA'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Offline safety tests (no API secret)
        run: python3 -B -m unittest discover -s Tools/AIReview -p 'test_*.py' -v
      - name: Public free-model catalog and coding benchmark probe (no project data)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 -B Tools/AIReview/quality_probe.py
      - name: Bounded external call (free models only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 -B Tools/AIReview/bridge.py
